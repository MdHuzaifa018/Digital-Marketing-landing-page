<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default SEO (overridden per page) -->
    <title>Digital Marketing Course in Lucknow | SkillEdge Digital</title>
    <meta name="description" content="Learn digital marketing with practical offline training in Lucknow. Master SEO, Google Ads, Meta Ads, Social Media. Small batches, expert mentorship." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Digital Marketing Course in Lucknow | SkillEdge Digital" />
    <meta property="og:description" content="Practical offline digital marketing training in Lucknow. Small batches, real tools, expert mentorship." />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Digital Marketing Course in Lucknow | SkillEdge Digital" />
    <meta name="twitter:description" content="Practical offline digital marketing training in Lucknow." />

    <!-- Local SEO -->
    <meta name="geo.region" content="IN-UP" />
    <meta name="geo.placename" content="Lucknow" />

    <!-- Preconnect for Google Fonts (used in CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Staatliches&display=swap" rel="stylesheet">

    <!-- Structured Data: EducationalOrganization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "SkillEdge Digital",
      "description": "Offline Digital Marketing Training Institute in Lucknow, Uttar Pradesh",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Lucknow",
        "addressRegion": "Uttar Pradesh",
        "addressCountry": "IN"
      },
      "url": "https://skilledgedigital.in"
    }
    </script>
  </head>
  <body>
    <div id="root">
      <style>
        .neo-loader-wrapper {
          position: fixed;
          top: 0; left: 0; width: 100vw; height: 100vh;
          background: #ffffff;
          display: flex;
          flex-direction: column;
          gap: 20px;
          justify-content: center;
          align-items: center;
          z-index: 99999;
          background-image: linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px);
          background-size: 40px 40px;
        }
        .neo-loader-box {
          width: 50px;
          height: 50px;
          background: #fdfbb7;
          border: 4px solid #000;
          box-shadow: 6px 6px 0 #000;
          animation: neo-spin 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite;
        }
        .neo-loader-text {
          font-family: 'Poppins', sans-serif;
          font-weight: 800;
          text-transform: uppercase;
          letter-spacing: 2px;
          font-size: 14px;
          color: #000;
        }
        @keyframes neo-spin {
          0% { transform: rotate(0deg) scale(1); border-radius: 0; }
          50% { transform: rotate(180deg) scale(0.6); background: #ff4785; border-radius: 50%; box-shadow: 12px 12px 0 #000; }
          100% { transform: rotate(360deg) scale(1); border-radius: 0; }
        }
      </style>
      <div class="neo-loader-wrapper">
        <div class="neo-loader-box"></div>
        <div class="neo-loader-text">Loading...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
